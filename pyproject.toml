[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vicioussquid-diceroll"
version = "2.0.0"
description = "Headless, event-driven dice rolling with optional Pygame animations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Rufus Pearce"}]
keywords = ["dice", "tabletop", "probability", "random", "library"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
animation = ["pygame-ce>=2.5"]

[tool.setuptools]
py-modules = ["diceroll", "diceroll_api", "diceroll_anim"]
packages = ["diceroll_images"]

[tool.setuptools.package-dir]
diceroll_images = "diceroll/images"

[tool.setuptools.package-data]
diceroll_images = ["*/*.jpg", "*/*.png", "*.png"]
