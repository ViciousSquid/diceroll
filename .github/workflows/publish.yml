name: Publish diceroll to PyPI

# A published GitHub Release is the only publishing trigger. Running this
# manually performs a safe build/check dry-run and never uploads to PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release tag matches package version and default branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          version = data["project"]["version"]
          if os.environ["EVENT_NAME"] == "release":
              expected = "v" + version
              assert os.environ["RELEASE_TAG"] == expected, (
                  f"Release tag must be {expected}, got {os.environ['RELEASE_TAG']!r}"
              )
          print(f"Validated distribution: {data['project']['name']} {version}")
          PY
          if [ "$EVENT_NAME" = "release" ]; then
            git fetch origin "$DEFAULT_BRANCH"
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || {
              echo "Release commit must be on the repository's default branch"
              exit 1
            }
          fi
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify public docs, examples and bundled dice artwork
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile
          source = glob.glob("dist/*.tar.gz")
          wheels = glob.glob("dist/*.whl")
          assert len(source) == len(wheels) == 1, "Expected exactly one sdist and wheel"
          with tarfile.open(source[0]) as archive:
              names = [x.name for x in archive.getmembers()]
              assert any(n.endswith("/docs/API.md") for n in names)
              assert any(n.endswith("/docs/PUBLISHING.md") for n in names)
              assert any(n.endswith("/examples/roll_and_render.py") for n in names)
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              for suffix in (
                  "diceroll/__init__.py", "diceroll/core.py", "diceroll/svg.py",
                  "diceroll/images/blank_d4.png", "diceroll/images/blank_d8.png",
                  "diceroll/images/blank_d10.png", "diceroll/images/blank_d12.png",
                  "diceroll/images/blank_d20.png",
                  "diceroll/images/blue/dice1.png",
                  "diceroll/images/red/dice1.png",
                  "diceroll/images/white/dice1.jpg",
              ):
                  assert suffix in names, f"Missing from wheel: {suffix}"
          print("Wheel and sdist contents verified")
          PY
      - name: Upload checked distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish on PyPI (Trusted Publishing)
    needs: [build]
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vicioussquid-diceroll
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - name: Publish with short-lived PyPI credentials
        uses: pypa/gh-action-pypi-publish@release/v1
