name: Python library tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
      - name: Execute unit tests
        run: python -m unittest discover -s tests -v
      - name: Import installed module outside the checkout
        run: |
          cd /tmp
          python -c "import sys; from diceroll import DiceRoller, render_svg; r=DiceRoller().roll('d4 + d6 + d8 + d10 + d12 + d20', d6_colour='red'); assert '<svg' in render_svg(r); assert 'pygame' not in sys.modules"
          python -c "import importlib.util; assert importlib.util.find_spec('diceroll_api') is None; assert importlib.util.find_spec('diceroll_anim') is None"
      - name: Check sdist can be independently installed
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.tar.gz
          cd /tmp
          python -c "from diceroll import DiceRoller, render_svg; r=DiceRoller().roll('2d4+3d6+d8+d10+d12+d20', d6_colour='random'); assert len(r.faces) == 9; assert 'data:image/' in render_svg(r)"
      - name: Verify documentation and example are shipped in source distribution
        run: |
          python -c "import tarfile,glob; f=tarfile.open(glob.glob('dist/*.tar.gz')[0]); names=[x.name for x in f.getmembers()]; assert all(any(x.endswith('/'+p) for x in names) for p in ('docs/API.md','docs/PUBLISHING.md','examples/roll_and_render.py'))"
      - name: Run example against the installed source distribution
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/examples/roll_and_render.py"
          test -s dice_roll.svg
      - name: Verify no required third-party packages
        run: python -m pip check

  pygame-optional:
    name: Pygame animation (headless ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and optional pygame-ce
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install pygame-ce
      - name: Run the full real-engine suite including animated surfaces
        run: python -m unittest discover -s tests -v
      - name: Verify auto detection, headless frames and final faces
        run: |
          python -I -c "import random,pygame; from diceroll import DiceRoller, PygameDiceAnimation, pygame_available, visualise; assert pygame_available(); r=DiceRoller(rng=random.Random(21)).roll('d20+5d6+d8',d6_colour='random'); a=visualise(r); assert isinstance(a,PygameDiceAnimation); screen=pygame.Surface((1000,800)); a.draw(screen,a.total_duration+0.1); assert tuple(f.face for f in a.frames(a.total_duration+0.1))==r.faces"
      - name: Verify Pygame remains optional in package metadata
        run: |
          python -I -c "import importlib.metadata as m; assert not m.requires('vicioussquid-diceroll')"
          python -m pip check
