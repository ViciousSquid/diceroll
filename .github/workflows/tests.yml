name: Library tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install headless library
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check installed imports without repository on path
        run: |
          cd /tmp
          python -c "from diceroll import DiceRoller; from diceroll_api import DiceAPI; import diceroll_images; assert DiceAPI().roll_dice('d20+2')['roll_result'] >= 3"
